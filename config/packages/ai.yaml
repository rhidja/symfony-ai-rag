parameters:
    app.rag.embeddings_model: 'text-embedding-3-small'
    app.rag.chat_model: 'gpt-4o-mini'
    app.rag.store_table: 'document_chunks'
    app.rag.chunk_size: 1000
    app.rag.chunk_overlap: 150
    app.rag.top_k: 5

ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'

    store:
        postgres:
            default:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: '%app.rag.store_table%'

    vectorizer:
        default:
            platform: 'ai.platform.openai'
            model: '%app.rag.embeddings_model%'

    retriever:
        default:
            vectorizer: 'ai.vectorizer.default'
            store: 'ai.store.postgres.default'

    indexer:
        documents:
            loader: 'App\Rag\Loader\ExtensionAwareLoader'
            vectorizer: 'ai.vectorizer.default'
            store: 'ai.store.postgres.default'
            transformers:
                - 'app.rag.transformer.split'

    # Agent-based RAG: the LLM decides itself whether/how many times to call
    # search_knowledge_base, instead of a single fixed retrieve-then-generate pass.
    agent:
        rag:
            platform: 'ai.platform.openai'
            model: '%app.rag.chat_model%'
            prompt:
                text: |
                    You are a helpful assistant answering questions about an internal knowledge base.
                    Use the search_knowledge_base tool to find relevant information before answering.
                    Cite your sources. If you can't find an answer, say so clearly instead of making one up.
                include_tools: true
            tools:
                - 'App\Agent\Tool\SimilaritySearch'
            include_sources: true
